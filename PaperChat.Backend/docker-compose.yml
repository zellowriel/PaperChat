services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: paperchat-api
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      Firebase__ProjectId: "${FIREBASE_PROJECT_ID:?Set FIREBASE_PROJECT_ID}"
      ConnectionStrings__DefaultConnection: "${NEON_CONNECTION_STRING:?Set NEON_CONNECTION_STRING}"
      Gemini__ApiKey: "${GEMINI_API_KEY:?Set GEMINI_API_KEY}"
    # ĐỒNG BỘ THƯ MỤC CHỨA FILE VÀO CONTAINER
    volumes:
      - ./App_Data:/app/App_Data